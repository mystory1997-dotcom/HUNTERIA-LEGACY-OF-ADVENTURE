<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HUNTERIA: LEGACY OF ADVENTURE</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
  }

  body {
    background: #0d0b0a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .game-screen {
    position: relative;
    width: 100vw;
    max-width: 1280px;
    aspect-ratio: 16 / 9;
    background: #140f0c;
    box-shadow: 0 0 40px rgba(0,0,0,0.95);
    overflow: hidden;
  }

  /* ระบบสลับฉากแบบสมูท */
  .scene {
    position: absolute;
    inset: 0;
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    opacity: 0;
    visibility: hidden;
    transform: scale(1.015);
    transition: opacity 0.36s ease, transform 0.42s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.36s ease;
  }
  .scene.is-active {
    opacity: 1;
    visibility: visible;
    transform: scale(1);
    z-index: 2;
  }

  #sceneLogin { background-image: url('login.jpg'); }
  #sceneSelect { background-image: url('select.jpg'); }
  #sceneCreate { background-image: url('create.jpg'); }

  /* ปุ่มเกมสัมผัสสมูทไร้กล่องสีฟ้า */
  .game-btn {
    position: absolute;
    background: transparent;
    border: none;
    outline: none;
    cursor: pointer;
    overflow: hidden;
    transform: translateZ(0) scale(1);
    transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s ease, filter 0.22s ease;
  }
  .game-btn:focus, .game-btn:focus-visible { outline: none; }
  @media (hover: hover) {
    .game-btn:hover { transform: scale(1.02); filter: brightness(1.12); }
  }
  .game-btn:active, .game-btn.is-pressed {
    transform: scale(0.95);
    filter: brightness(1.22);
    transition: transform 0.08s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .touch-ripple {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0);
    background: radial-gradient(circle, rgba(255, 236, 179, 0.65) 0%, rgba(255, 200, 100, 0.2) 55%, transparent 75%);
    animation: rippleAnim 0.46s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .blue-glow .touch-ripple {
    background: radial-gradient(circle, rgba(175, 238, 255, 0.75) 0%, rgba(80, 195, 255, 0.25) 55%, transparent 75%);
  }
  @keyframes rippleAnim {
    to { transform: translate(-50%, -50%) scale(2.6); opacity: 0; }
  }

  /* ================= ฉาก 1: LOGIN ================= */
  .account-status {
    position: absolute;
    left: 78.8%; top: 26.8%; width: 17.8%;
    text-align: center;
    font-size: clamp(9px, 0.9vw, 12px);
    color: #ffe29a;
    background: rgba(20, 12, 8, 0.75);
    border: 1px solid rgba(212, 163, 89, 0.55);
    border-radius: 6px;
    padding: 3px 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
  }
  .hotspot-gmail { left: 78.8%; top: 31.8%; width: 17.8%; height: 13.8%; border-radius: 12px; }
  .hotspot-start { left: 79.6%; top: 51.8%; width: 16.2%; height: 8.4%; border-radius: 999px; }
  .hotspot-server { left: 80.2%; top: 62.2%; width: 15.0%; height: 7.5%; border-radius: 10px; }

  /* ================= ฉาก 2: SELECT CHARACTER ================= */
  .select-account-tag {
    position: absolute;
    left: 79.2%; top: 26.6%; width: 17.0%;
    text-align: center;
    font-size: clamp(8px, 0.85vw, 11px);
    color: #ffd98e;
    background: rgba(22, 14, 9, 0.78);
    border: 1px solid rgba(200, 157, 84, 0.45);
    border-radius: 5px;
    padding: 2px 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
  }

  .pedestal-slot {
    position: absolute;
    top: 38%;
    width: 13.5%;
    height: 48%;
    border-radius: 16px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 18%;
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .pedestal-slot:active { transform: scale(0.96); }
  .slot-0 { left: 12.0%; }
  .slot-1 { left: 28.0%; }
  .slot-2 { left: 43.6%; }
  .slot-3 { left: 58.6%; }

  .slot-rune {
    position: absolute;
    top: 24%;
    width: 58%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    border: 2px solid rgba(255, 215, 110, 0.85);
    box-shadow: 0 0 18px rgba(255, 200, 80, 0.75), inset 0 0 14px rgba(255, 220, 130, 0.55);
    background: radial-gradient(circle, rgba(255, 226, 145, 0.28) 0%, transparent 72%);
    opacity: 0;
    transform: scale(0.75);
    transition: opacity 0.28s ease, transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
  }
  .pedestal-slot.is-selected .slot-rune {
    opacity: 1;
    transform: scale(1);
    animation: pulseRune 2s infinite ease-in-out;
  }
  @keyframes pulseRune {
    0%, 100% { box-shadow: 0 0 16px rgba(255, 200, 80, 0.7), inset 0 0 12px rgba(255, 220, 130, 0.45); }
    50% { box-shadow: 0 0 26px rgba(255, 220, 120, 0.95), inset 0 0 18px rgba(255, 240, 180, 0.7); }
  }

  .slot-avatar-wrap {
    width: 78%;
    z-index: 2;
    pointer-events: none;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,0.75));
  }
  .slot-char-badge {
    z-index: 3;
    margin-top: 2px;
    background: rgba(24, 15, 10, 0.9);
    border: 1px solid #d4a359;
    border-radius: 7px;
    padding: 3px 7px;
    text-align: center;
    color: #fff2d6;
    font-size: clamp(8px, 0.9vw, 12px);
    pointer-events: none;
  }
  .slot-char-badge strong { display: block; color: #ffd27d; }
  .slot-char-badge span { font-size: 0.85em; color: #cbb58e; }

  .panel-slot-info {
    position: absolute;
    left: 79.4%; top: 32.0%; width: 16.6%; height: 17.5%;
    background: linear-gradient(180deg, #e7d4b5, #d5be98);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6px;
    pointer-events: none;
    box-shadow: inset 0 0 10px rgba(92, 64, 34, 0.35);
  }
  .panel-slot-title { font-weight: 800; font-size: clamp(10px, 1.3vw, 17px); color: #5b4328; margin-bottom: 3px; }
  .panel-slot-desc { font-size: clamp(8.5px, 0.9vw, 12.5px); color: #3d2b18; line-height: 1.3; }

  .hotspot-create { left: 79.4%; top: 51.6%; width: 16.6%; height: 8.6%; border-radius: 999px; }
  .hotspot-back { left: 4.5%; top: 88.2%; width: 11.4%; height: 6.2%; border-radius: 999px; }

  /* ================= ฉาก 3: CREATE CHARACTER ================= */
  /* ปุ่มเลือก 4 เผ่าด้านซ้ายตรงกรอบภาพ create.jpg */
  .race-hotspot {
    left: 10.6%;
    width: 11.8%;
    height: 6.4%;
    border-radius: 10px;
    border: 1.5px solid transparent;
  }
  .race-hotspot.is-selected {
    border-color: #ffd27d;
    background: radial-gradient(circle, rgba(255, 215, 110, 0.25) 0%, rgba(255, 180, 60, 0.08) 100%);
    box-shadow: 0 0 14px rgba(255, 200, 80, 0.55);
  }
  .race-human { top: 33.4%; }
  .race-elf { top: 41.2%; }
  .race-dwarf { top: 49.0%; }
  .race-beastkin { top: 56.8%; }

  /* แถบปรับแต่ง Gender / Hair Style / Color Palette ด้านล่างซ้าย */
  .custom-value-box {
    position: absolute;
    left: 11.8%;
    width: 9.4%;
    height: 3.6%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff2d6;
    font-weight: 700;
    font-size: clamp(9px, 1vw, 13px);
    text-shadow: 0 1px 3px #000;
    pointer-events: none;
  }
  .val-gender { top: 69.2%; }
  .val-hair { top: 76.2%; }

  .arrow-btn {
    width: 2.3%;
    height: 3.8%;
    border-radius: 6px;
  }
  .gender-prev { left: 9.4%; top: 69.1%; }
  .gender-next { left: 21.3%; top: 69.1%; }
  .hair-prev { left: 9.4%; top: 76.1%; }
  .hair-next { left: 21.3%; top: 76.1%; }

  /* จานสีผม/สีผิว 4 ช่องตรง Color Palette */
  .swatch-btn {
    top: 83.2%;
    width: 2.1%;
    height: 3.4%;
    border-radius: 4px;
    border: 1.5px solid rgba(255,255,255,0.45);
  }
  .swatch-btn.is-selected {
    border: 2px solid #ffffff;
    box-shadow: 0 0 10px #ffd27d;
    transform: scale(1.12);
  }
  .swatch-0 { left: 12.1%; background: #f2c97d; }
  .swatch-1 { left: 14.5%; background: #e8e6e1; }
  .swatch-2 { left: 16.9%; background: #4a8fb8; }
  .swatch-3 { left: 19.3%; background: #8c3b3b; }

  /* ตัวละครตัวอย่างยืนบนแท่นกลางจอ */
  .creator-stage-avatar {
    position: absolute;
    left: 43.2%;
    top: 33.5%;
    width: 13.6%;
    pointer-events: none;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,0.8));
    transition: transform 0.25s ease;
  }

  /* ตัวเลขค่าสเตตัส HP / MP / ST ในวงกลม 3 วงด้านขวา */
  .stat-circle-val {
    position: absolute;
    top: 34.4%;
    width: 4.5%;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: clamp(11px, 1.3vw, 18px);
    color: #ffd982;
    text-shadow: 0 2px 4px #000;
    pointer-events: none;
  }
  .stat-hp { left: 79.4%; }
  .stat-mp { left: 85.4%; }
  .stat-st { left: 91.4%; }

  /* ช่องพิมพ์ชื่อตัวละครตรงกรอบ Character Name ด้านขวา */
  .input-char-name {
    position: absolute;
    left: 79.2%;
    top: 47.4%;
    width: 16.9%;
    height: 4.4%;
    background: rgba(18, 11, 7, 0.72);
    border: 1px solid rgba(212, 163, 89, 0.65);
    border-radius: 6px;
    color: #fff5dc;
    text-align: center;
    font-weight: 700;
    font-size: clamp(10px, 1.1vw, 15px);
    padding: 0 8px;
    outline: none;
    user-select: text;
  }
  .input-char-name::placeholder { color: rgba(235, 215, 178, 0.55); font-weight: 400; }

  /* ปุ่ม CONFIRM CHARACTER และ START GAME ด้านขวา */
  .hotspot-confirm-char { left: 79.3%; top: 53.6%; width: 16.7%; height: 7.4%; border-radius: 999px; }
  .hotspot-create-start { left: 79.3%; top: 62.6%; width: 16.7%; height: 8.6%; border-radius: 999px; }
  .hotspot-create-back { left: 4.5%; top: 88.2%; width: 11.4%; height: 6.2%; border-radius: 999px; }

  /* ================= MODAL ================= */
  .modal-overlay {
    display: flex;
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.78);
    justify-content: center;
    align-items: center;
    z-index: 30;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.22s ease, visibility 0.22s ease;
  }
  .modal-overlay.is-open { opacity: 1; visibility: visible; }
  .modal-box {
    background: linear-gradient(180deg, #3b2a1e, #241811);
    border: 2px solid #c89d54;
    border-radius: 14px;
    padding: 20px 24px;
    width: 92%;
    max-width: 420px;
    text-align: center;
    color: #f5e6c8;
    box-shadow: 0 14px 36px rgba(0,0,0,0.88);
    transform: scale(0.92) translateY(8px);
    transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .modal-overlay.is-open .modal-box { transform: scale(1) translateY(0); }
  .modal-box h2 { color: #ffd27d; margin-bottom: 8px; font-size: 19px; }
  .modal-box p { margin-bottom: 14px; font-size: 13.5px; line-height: 1.45; color: #ebd7b2; white-space: pre-line; }

  .gmail-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; text-align: left; }
  .gmail-account-item {
    background: rgba(255, 243, 214, 0.08);
    border: 1px solid rgba(200, 157, 84, 0.5);
    border-radius: 8px;
    padding: 9px 11px;
    color: #fff3d6;
    cursor: pointer;
  }
  .gmail-account-email { display: block; font-weight: 700; font-size: 13.5px; color: #ffd27d; }
  .gmail-account-sub { font-size: 11.5px; color: #d8c39e; }
  .gmail-custom-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .gmail-custom-input {
    flex: 1;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #c89d54;
    background: #18100b;
    color: #fff3d6;
    font-size: 14px;
    outline: none;
    user-select: text;
  }
  .modal-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .modal-btn {
    background: linear-gradient(180deg, #2d8bc9, #1b5c8a);
    color: white;
    border: 1px solid #7cc7f7;
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  .modal-btn:active { transform: scale(0.95); }
  .modal-btn-secondary { background: rgba(255,255,255,0.12); border: 1px solid #9e845c; }
</style>
</head>
<body>

<div class="game-screen">

  <!-- ฉากที่ 1: หน้าจอ LOGIN -->
  <div class="scene is-active" id="sceneLogin">
    <div class="account-status" id="accountStatus">ยังไม่ได้ล็อกอิน Gmail</div>
    <button type="button" class="game-btn hotspot-gmail" data-action="gmail" aria-label="Sign in with Gmail"></button>
    <button type="button" class="game-btn blue-glow hotspot-start" data-action="start" aria-label="START GAME"></button>
    <button type="button" class="game-btn hotspot-server" data-action="server" aria-label="Server Select"></button>
  </div>

  <!-- ฉากที่ 2: หน้าจอ SELECT CHARACTER -->
  <div class="scene" id="sceneSelect">
    <div class="select-account-tag" id="selectAccountTag">Gmail: -</div>

    <div class="pedestal-slot slot-0" data-slot="0" onclick="selectSlot(0)">
      <div class="slot-rune"></div>
      <div class="slot-avatar-wrap" id="slotAvatar0"></div>
      <div id="slotBadge0"></div>
    </div>
    <div class="pedestal-slot slot-1" data-slot="1" onclick="selectSlot(1)">
      <div class="slot-rune"></div>
      <div class="slot-avatar-wrap" id="slotAvatar1"></div>
      <div id="slotBadge1"></div>
    </div>
    <div class="pedestal-slot slot-2" data-slot="2" onclick="selectSlot(2)">
      <div class="slot-rune"></div>
      <div class="slot-avatar-wrap" id="slotAvatar2"></div>
      <div id="slotBadge2"></div>
    </div>
    <div class="pedestal-slot slot-3" data-slot="3" onclick="selectSlot(3)">
      <div class="slot-rune"></div>
      <div class="slot-avatar-wrap" id="slotAvatar3"></div>
      <div id="slotBadge3"></div>
    </div>

    <div class="panel-slot-info">
      <div class="panel-slot-title" id="panelSlotTitle">EMPTY SLOT</div>
      <div class="panel-slot-desc" id="panelSlotDesc">แตะเลือกแท่นยืนเพื่อสร้างหรือเลือกตัวละคร</div>
    </div>

    <button type="button" class="game-btn blue-glow hotspot-create" data-action="createOrEnter" aria-label="CREATE CHARACTER"></button>
    <button type="button" class="game-btn hotspot-back" data-action="backToLogin" aria-label="BACK"></button>
  </div>

  <!-- ฉากที่ 3: หน้าจอ CREATE CHARACTER -->
  <div class="scene" id="sceneCreate">
    <!-- ปุ่มเลือก 4 เผ่าด้านซ้าย -->
    <button type="button" class="game-btn race-hotspot race-human is-selected" data-race="Human" onclick="setRace('Human')"></button>
    <button type="button" class="game-btn race-hotspot race-elf" data-race="Elf" onclick="setRace('Elf')"></button>
    <button type="button" class="game-btn race-hotspot race-dwarf" data-race="Dwarf" onclick="setRace('Dwarf')"></button>
    <button type="button" class="game-btn race-hotspot race-beastkin" data-race="Beastkin" onclick="setRace('Beastkin')"></button>

    <!-- ปรับเพศ ทรงผม และจานสี -->
    <button type="button" class="game-btn arrow-btn gender-prev" onclick="cycleGender(-1)"></button>
    <div class="custom-value-box val-gender" id="valGender">ชาย</div>
    <button type="button" class="game-btn arrow-btn gender-next" onclick="cycleGender(1)"></button>

    <button type="button" class="game-btn arrow-btn hair-prev" onclick="cycleHair(-1)"></button>
    <div class="custom-value-box val-hair" id="valHair">ทรงที่ 1</div>
    <button type="button" class="game-btn arrow-btn hair-next" onclick="cycleHair(1)"></button>

    <button type="button" class="game-btn swatch-btn swatch-0 is-selected" onclick="setHairColor(0)"></button>
    <button type="button" class="game-btn swatch-btn swatch-1" onclick="setHairColor(1)"></button>
    <button type="button" class="game-btn swatch-btn swatch-2" onclick="setHairColor(2)"></button>
    <button type="button" class="game-btn swatch-btn swatch-3" onclick="setHairColor(3)"></button>

    <!-- ตัวละครอนิเมะยืนบนแท่นกลางจอ -->
    <div class="creator-stage-avatar" id="creatorAvatarStage"></div>

    <!-- ตัวเลขค่าสเตตัส HP / MP / ST ในวงกลม 3 วงด้านขวา -->
    <div class="stat-circle-val stat-hp" id="statHpVal">100</div>
    <div class="stat-circle-val stat-mp" id="statMpVal">100</div>
    <div class="stat-circle-val stat-st" id="statStVal">100</div>

    <!-- ช่องพิมพ์ชื่อ + ปุ่มยืนยัน + ปุ่มเริ่มเกม -->
    <input type="text" id="createCharNameInput" class="input-char-name" maxlength="14" placeholder="พิมพ์ชื่อตัวละคร...">
    <button type="button" class="game-btn blue-glow hotspot-confirm-char" data-action="confirmCreate" aria-label="CONFIRM CHARACTER"></button>
    <button type="button" class="game-btn blue-glow hotspot-create-start" data-action="confirmAndStart" aria-label="START GAME"></button>
    <button type="button" class="game-btn hotspot-create-back" data-action="backToSelect" aria-label="BACK"></button>
  </div>

  <!-- Modal แจ้งเตือน -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <h2 id="modalTitle">แจ้งเตือน</h2>
      <p id="modalText">รายละเอียด</p>
      <div id="modalExtra"></div>
      <div class="modal-actions" id="modalActions">
        <button type="button" class="modal-btn" onclick="closePopup()">ตกลง</button>
      </div>
    </div>
  </div>

</div>

<script>
  let audioCtx = null;
  let selectedSlot = null;
  let characters = [null, null, null, null];

  // ข้อมูลค่าพลังตั้งต้นทั้ง 4 เผ่า (รวม 300 แต้มเท่ากัน)
  const RACES = {
    Human:    { th: 'มนุษย์',      hp: 100, mp: 100, st: 100, skin: '#f7d3ba', outfit: '#3b6ea5' },
    Elf:      { th: 'เอลฟ์',       hp: 80,  mp: 140, st: 80,  skin: '#fbe2cf', outfit: '#2e7d5b' },
    Dwarf:    { th: 'คนแคระ',      hp: 100, mp: 60,  st: 140, skin: '#eab996', outfit: '#8c4a27' },
    Beastkin: { th: 'มนุษย์สัตว์', hp: 150, mp: 50,  st: 100, skin: '#e0ae86', outfit: '#6e352c' }
  };

  const HAIR_COLORS = ['#f2c97d', '#e8e6e1', '#4a8fb8', '#8c3b3b'];
  const GENDERS = ['ชาย', 'หญิง'];

  let draft = {
    race: 'Human',
    genderIdx: 0,
    hairIdx: 0,
    colorIdx: 0
  };

  function playClickSound(pitch = 520) {
    try {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(pitch, now);
      osc.frequency.exponentialRampToValueAtTime(pitch * 0.55, now + 0.065);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.075);
    } catch (e) {}
  }

  document.querySelectorAll('.game-btn').forEach(btn => {
    btn.addEventListener('pointerdown', (e) => {
      btn.classList.add('is-pressed');
      const rect = btn.getBoundingClientRect();
      const ripple = document.createElement('span');
      const size = Math.max(rect.width, rect.height);
      ripple.className = 'touch-ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left) + 'px';
      ripple.style.top = (e.clientY - rect.top) + 'px';
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 480);
      playClickSound(600);
    });
    const release = () => btn.classList.remove('is-pressed');
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('pointercancel', release);

    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      if (!action) return;
      setTimeout(() => {
        if (action === 'gmail') openGmailLogin();
        else if (action === 'start') handleStart();
        else if (action === 'server') showPopup('เลือกเซิร์ฟเวอร์', 'เซิร์ฟเวอร์ปัจจุบัน: Arcadia (Asia)\nสถานะเซิร์ฟเวอร์: ออนไลน์ปกติ (Ping 18ms)');
        else if (action === 'createOrEnter') handleCreateOrEnter();
        else if (action === 'backToLogin') switchScene('sceneLogin');
        else if (action === 'backToSelect') switchScene('sceneSelect');
        else if (action === 'confirmCreate') saveCreatedCharacter(false);
        else if (action === 'confirmAndStart') saveCreatedCharacter(true);
      }, 100);
    });
  });

  window.onload = () => {
    const savedGmail = localStorage.getItem('hunteria_gmail');
    updateAccountStatus(savedGmail);
    loadCharacters();
    renderCreatorPreview();
  };

  function switchScene(sceneId) {
    document.querySelectorAll('.scene').forEach(s => s.classList.remove('is-active'));
    document.getElementById(sceneId).classList.add('is-active');
    if (sceneId === 'sceneSelect') {
      renderSlots();
    }
  }

  function updateAccountStatus(email) {
    document.getElementById('accountStatus').innerText = email ? 'Gmail: ' + email : 'ยังไม่ได้ล็อกอิน Gmail';
    document.getElementById('selectAccountTag').innerText = email ? email : 'Guest';
  }

  function handleStart() {
    const email = localStorage.getItem('hunteria_gmail');
    if (!email) {
      showPopup('กรุณาล็อกอินก่อนเริ่มเกม', 'โปรดแตะที่ปุ่ม Sign in with Google / Login with Gmail ก่อนเข้าสู่เกมครับ', '', `
        <button type="button" class="modal-btn" onclick="openGmailLogin()">ล็อกอิน Gmail</button>
        <button type="button" class="modal-btn modal-btn-secondary" onclick="closePopup()">ปิด</button>
      `);
      return;
    }
    loadCharacters();
    selectedSlot = null;
    switchScene('sceneSelect');
  }

  function getStorageKey() {
    const email = localStorage.getItem('hunteria_gmail') || 'default';
    return 'hunteria_chars_' + email;
  }

  function loadCharacters() {
    try {
      const raw = localStorage.getItem(getStorageKey());
      characters = raw ? JSON.parse(raw) : [null, null, null, null];
      if (!Array.isArray(characters) || characters.length !== 4) characters = [null, null, null, null];
    } catch (e) {
      characters = [null, null, null, null];
    }
    renderSlots();
  }

  function saveCharacters() {
    localStorage.setItem(getStorageKey(), JSON.stringify(characters));
  }

  function selectSlot(idx) {
    playClickSound(580);
    selectedSlot = idx;
    renderSlots();
  }

  // สร้างภาพตัวละครอนิเมะแบบ SVG ตามเผ่า เพศ ทรงผม และสีผมที่เลือก
  function buildAvatarSVG(cfg) {
    const r = RACES[cfg.race] || RACES.Human;
    const hair = HAIR_COLORS[cfg.colorIdx] || HAIR_COLORS[0];
    const isFemale = cfg.genderIdx === 1;
    const isDwarf = cfg.race === 'Dwarf';
    const isElf = cfg.race === 'Elf';
    const isBeast = cfg.race === 'Beastkin';

    const bodyScale = isDwarf ? 'transform="translate(0,14) scale(1,0.88)"' : '';
    const ears = isElf
      ? `<polygon points="34,54 20,48 34,62" fill="${r.skin}"/><polygon points="86,54 100,48 86,62" fill="${r.skin}"/>`
      : '';
    const beastEars = isBeast
      ? `<polygon points="36,36 30,14 48,28" fill="${hair}"/><polygon points="84,36 90,14 72,28" fill="${hair}"/>`
      : '';
    const beard = (isDwarf && !isFemale)
      ? `<path d="M42,72 Q60,96 78,72 L72,88 Q60,98 48,88 Z" fill="${hair}"/>`
      : '';

    let backHair = '';
    if (isFemale || cfg.hairIdx === 2) {
      backHair = `<path d="M32,45 Q26,88 38,105 L82,105 Q94,88 88,45 Z" fill="${hair}"/>`;
    }
    let frontHair = `<path d="M34,48 Q38,24 60,24 Q82,24 86,48 Q74,36 60,42 Q46,36 34,48 Z" fill="${hair}"/>`;
    if (cfg.hairIdx === 1) {
      frontHair = `<path d="M33,50 L42,22 L54,38 L62,20 L72,38 L82,24 L87,50 Q60,38 33,50 Z" fill="${hair}"/>`;
    } else if (cfg.hairIdx === 3) {
      frontHair = `<path d="M34,52 Q60,20 86,52 L82,36 Q60,26 38,36 Z" fill="${hair}"/>`;
    }

    return `
      <svg viewBox="0 0 120 150" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <g ${bodyScale}>
          ${backHair}
          ${beastEars}
          ${ears}
          <!-- ลำตัวและชุดนักล่า -->
          <path d="M36,92 Q60,84 84,92 L92,144 L28,144 Z" fill="${r.outfit}" stroke="#23170e" stroke-width="2.5"/>
          <path d="M48,90 L60,112 L72,90" fill="#d9b36c"/>
          <!-- ส่วนหัว -->
          <circle cx="60" cy="56" r="25" fill="${r.skin}" stroke="#23170e" stroke-width="2.2"/>
          <!-- ดวงตา -->
          <ellipse cx="50" cy="57" rx="3.2" ry="4" fill="#23170e"/>
          <ellipse cx="70" cy="57" rx="3.2" ry="4" fill="#23170e"/>
          <circle cx="51" cy="55.5" r="1.2" fill="#ffffff"/>
          <circle cx="71" cy="55.5" r="1.2" fill="#ffffff"/>
          <!-- ปาก -->
          <path d="M55,69 Q60,73 65,69" fill="none" stroke="#6e3b2e" stroke-width="2" stroke-linecap="round"/>
          ${beard}
          ${frontHair}
        </g>
      </svg>
    `;
  }

  function renderSlots() {
    for (let i = 0; i < 4; i++) {
      const slotEl = document.querySelector('.slot-' + i);
      const badgeEl = document.getElementById('slotBadge' + i);
      const avatarEl = document.getElementById('slotAvatar' + i);
      if (selectedSlot === i) slotEl.classList.add('is-selected');
      else slotEl.classList.remove('is-selected');

      const char = characters[i];
      if (char) {
        const rInfo = RACES[char.race] || RACES.Human;
        avatarEl.innerHTML = buildAvatarSVG(char);
        badgeEl.innerHTML = `<div class="slot-char-badge"><strong>${escapeHtml(char.name)}</strong><span>${rInfo.th} Lv.${char.level || 1}</span></div>`;
      } else {
        avatarEl.innerHTML = '';
        badgeEl.innerHTML = '';
      }
    }

    const titleEl = document.getElementById('panelSlotTitle');
    const descEl = document.getElementById('panelSlotDesc');
    if (selectedSlot === null) {
      titleEl.innerText = 'EMPTY SLOT';
      descEl.innerText = 'แตะเลือกแท่นยืนเพื่อสร้างหรือเลือกตัวละคร';
    } else {
      const char = characters[selectedSlot];
      if (char) {
        const rInfo = RACES[char.race] || RACES.Human;
        titleEl.innerText = char.name;
        descEl.innerText = `${rInfo.th} (Lv.1)\nHP ${rInfo.hp} | MP ${rInfo.mp} | ST ${rInfo.st}`;
      } else {
        titleEl.innerText = `SLOT ${selectedSlot + 1} - ว่าง`;
        descEl.innerText = 'แตะปุ่ม CREATE CHARACTER เพื่อสร้างนักล่าคนใหม่';
      }
    }
  }

  function handleCreateOrEnter() {
    if (selectedSlot === null) {
      showPopup('ยังไม่ได้เลือกแท่นยืน', 'โปรดแตะเลือกแท่นยืนช่องใดช่องหนึ่ง (ช่อง 1 - 4) ก่อนครับ');
      return;
    }

    const existing = characters[selectedSlot];
    if (existing) {
      const rInfo = RACES[existing.race] || RACES.Human;
      showPopup(
        'เข้าสู่โลก HUNTERIA',
        `ตัวละคร: ${existing.name} (เผ่า${rInfo.th} Lv.1)\nHP: ${rInfo.hp} | MP: ${rInfo.mp} | ST: ${rInfo.st}\n\nกำลังเตรียมเข้าสู่เมืองอาร์คาเดียและหลุมดันเจี้ยน!`,
        '',
        `
          <button type="button" class="modal-btn" onclick="closePopup()">ตกลง</button>
          <button type="button" class="modal-btn modal-btn-secondary" onclick="deleteCharacter(${selectedSlot})">ลบตัวละคร</button>
        `
      );
      return;
    }

    // รีเซ็ตค่าเริ่มต้นแล้วเปิดฉาก create.jpg
    draft = { race: 'Human', genderIdx: 0, hairIdx: 0, colorIdx: 0 };
    document.getElementById('createCharNameInput').value = '';
    setRace('Human');
    setHairColor(0);
    renderCreatorPreview();
    switchScene('sceneCreate');
  }

  function setRace(raceKey) {
    draft.race = raceKey;
    document.querySelectorAll('.race-hotspot').forEach(el => {
      el.classList.toggle('is-selected', el.dataset.race === raceKey);
    });
    const r = RACES[raceKey];
    document.getElementById('statHpVal').innerText = r.hp;
    document.getElementById('statMpVal').innerText = r.mp;
    document.getElementById('statStVal').innerText = r.st;
    renderCreatorPreview();
  }

  function cycleGender(dir) {
    draft.genderIdx = (draft.genderIdx + dir + GENDERS.length) % GENDERS.length;
    renderCreatorPreview();
  }

  function cycleHair(dir) {
    draft.hairIdx = (draft.hairIdx + dir + 4) % 4;
    renderCreatorPreview();
  }

  function setHairColor(idx) {
    draft.colorIdx = idx;
    document.querySelectorAll('.swatch-btn').forEach((el, i) => {
      el.classList.toggle('is-selected', i === idx);
    });
    renderCreatorPreview();
  }

  function renderCreatorPreview() {
    document.getElementById('valGender').innerText = GENDERS[draft.genderIdx];
    document.getElementById('valHair').innerText = 'ทรงที่ ' + (draft.hairIdx + 1);
    document.getElementById('creatorAvatarStage').innerHTML = buildAvatarSVG(draft);
  }

  function saveCreatedCharacter(enterImmediately) {
    const input = document.getElementById('createCharNameInput');
    const name = input ? input.value.trim() : '';
    if (!name) {
      showPopup('ยังไม่ได้ตั้งชื่อตัวละคร', 'กรุณาพิมพ์ชื่อตัวละครในช่อง Character Name ด้านขวาก่อนครับ');
      return;
    }

    const r = RACES[draft.race];
    characters[selectedSlot] = {
      name: name,
      race: draft.race,
      genderIdx: draft.genderIdx,
      hairIdx: draft.hairIdx,
      colorIdx: draft.colorIdx,
      level: 1,
      hp: r.hp,
      mp: r.mp,
      st: r.st
    };
    saveCharacters();
    playClickSound(760);
    switchScene('sceneSelect');

    if (enterImmediately) {
      showPopup('เริ่มการผจญภัย!', `นักล่า "${name}" (เผ่า${r.th})\nHP ${r.hp} | MP ${r.mp} | ST ${r.st}\nพร้อมออกสำรวจหลุมดันเจี้ยนอาร์คาเดียแล้ว!`);
    } else {
      showPopup('สร้างตัวละครสำเร็จ', `บันทึก "${name}" (เผ่า${r.th}) ลงในแท่นที่ ${selectedSlot + 1} เรียบร้อยแล้ว`);
    }
  }

  function deleteCharacter(idx) {
    characters[idx] = null;
    saveCharacters();
    renderSlots();
    closePopup();
  }

  function openGmailLogin() {
    const lastGmail = localStorage.getItem('hunteria_gmail') || '';
    const extraHtml = `
      <div class="gmail-list">
        ${lastGmail ? `
          <div class="gmail-account-item" onclick="completeGmailLogin('${escapeAttr(lastGmail)}')">
            <span class="gmail-account-email">${escapeHtml(lastGmail)}</span>
            <span class="gmail-account-sub">บัญชี Gmail ที่ใช้ล่าสุด</span>
          </div>
        ` : ''}
        <div class="gmail-account-item" onclick="completeGmailLogin('hunter.arcadia@gmail.com')">
          <span class="gmail-account-email">hunter.arcadia@gmail.com</span>
          <span class="gmail-account-sub">บัญชีนักล่าอาร์คาเดีย</span>
        </div>
      </div>
      <div class="gmail-custom-row">
        <input type="email" id="customGmailInput" class="gmail-custom-input" placeholder="กรอก @gmail.com ของคุณ...">
        <button type="button" class="modal-btn" onclick="submitCustomGmail()">ใช้เมลนี้</button>
      </div>
    `;
    showPopup('ล็อกอินผ่าน Gmail', 'เลือกบัญชี Gmail หรือกรอกอีเมลของคุณเพื่อเข้าสู่เกม HUNTERIA', extraHtml, `
      <button type="button" class="modal-btn modal-btn-secondary" onclick="closePopup()">ยกเลิก</button>
    `);
  }

  function submitCustomGmail() {
    const input = document.getElementById('customGmailInput');
    if (!input) return;
    const email = input.value.trim();
    if (!email || !email.includes('@')) {
      alert('กรุณากรอกที่อยู่ Gmail ให้ถูกต้องครับ');
      return;
    }
    completeGmailLogin(email);
  }

  function completeGmailLogin(email) {
    playClickSound(720);
    localStorage.setItem('hunteria_gmail', email);
    updateAccountStatus(email);
    showPopup('ล็อกอิน Gmail สำเร็จ', 'เชื่อมต่อบัญชี ' + email + ' เรียบร้อยแล้ว\nแตะ START GAME เพื่อเข้าสู่หน้าเลือกตัวละครได้เลยครับ');
  }

  function showPopup(title, text, extraHtml = '', actionsHtml = `<button type="button" class="modal-btn" onclick="closePopup()">ตกลง</button>`) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalText').innerText = text;
    document.getElementById('modalExtra').innerHTML = extraHtml;
    document.getElementById('modalActions').innerHTML = actionsHtml;
    document.getElementById('modal').classList.add('is-open');
  }

  function closePopup() {
    playClickSound(400);
    document.getElementById('modal').classList.remove('is-open');
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
  }
  function escapeAttr(str) {
    return String(str).replace(/'/g, "\\'");
  }
</script>
</body>
</html>
