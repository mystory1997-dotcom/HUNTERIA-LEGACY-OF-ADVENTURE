<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HUNTERIA: LEGACY OF ADVENTURE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body {
    background: #0d0b0a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .game-screen {
    position: relative;
    width: 100vw;
    max-width: 1280px;
    aspect-ratio: 16 / 9;
    background: url('login.jpg') center/cover no-repeat;
    box-shadow: 0 0 40px rgba(0,0,0,0.9);
    overflow: hidden;
  }

  /* ปุ่มใสซ้อนทับกรอบปุ่ม Login with Gmail ในภาพพอดี */
  .hotspot-gmail {
    position: absolute;
    left: 78.8%;
    top: 31.8%;
    width: 17.8%;
    height: 13.8%;
    background: transparent;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.15s;
  }
  .hotspot-gmail:hover {
    background: rgba(255, 220, 140, 0.14);
    box-shadow: 0 0 14px rgba(255, 210, 110, 0.45);
  }
  .hotspot-gmail:active { transform: scale(0.98); }

  /* ปุ่มใสซ้อนทับกรอบ START GAME ในภาพพอดี */
  .hotspot-start {
    position: absolute;
    left: 79.6%;
    top: 51.8%;
    width: 16.2%;
    height: 8.4%;
    background: transparent;
    border: none;
    border-radius: 24px;
    cursor: pointer;
    transition: 0.15s;
  }
  .hotspot-start:hover {
    background: rgba(90, 200, 255, 0.16);
    box-shadow: 0 0 16px rgba(72, 187, 255, 0.55);
  }
  .hotspot-start:active { transform: scale(0.97); }

  /* ปุ่มใสซ้อนทับ Server Select: Arcadia (Asia) */
  .hotspot-server {
    position: absolute;
    left: 80.2%;
    top: 62.2%;
    width: 15.0%;
    height: 7.5%;
    background: transparent;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.15s;
  }
  .hotspot-server:hover { background: rgba(255, 255, 255, 0.1); }

  /* ป้ายสถานะบัญชีที่ล็อกอินอยู่ มุมขวาบนของแผง Login */
  .account-status {
    position: absolute;
    left: 78.8%;
    top: 26.8%;
    width: 17.8%;
    text-align: center;
    font-size: clamp(9px, 0.9vw, 12px);
    color: #ffe29a;
    background: rgba(20, 12, 8, 0.72);
    border: 1px solid rgba(212, 163, 89, 0.55);
    border-radius: 6px;
    padding: 3px 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
  }

  /* หน้าต่าง Modal */
  .modal-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.78);
    justify-content: center;
    align-items: center;
    z-index: 25;
  }
  .modal-box {
    background: linear-gradient(180deg, #3b2a1e, #241811);
    border: 2px solid #c89d54;
    border-radius: 12px;
    padding: 22px 26px;
    width: 92%;
    max-width: 420px;
    text-align: center;
    color: #f5e6c8;
    box-shadow: 0 12px 32px rgba(0,0,0,0.85);
  }
  .modal-box h2 { color: #ffd27d; margin-bottom: 10px; font-size: 20px; }
  .modal-box p { margin-bottom: 16px; font-size: 14px; line-height: 1.5; color: #ebd7b2; }

  .gmail-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
    text-align: left;
  }
  .gmail-account-item {
    background: rgba(255, 243, 214, 0.08);
    border: 1px solid rgba(200, 157, 84, 0.5);
    border-radius: 8px;
    padding: 10px 12px;
    color: #fff3d6;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 2px;
    transition: 0.15s;
  }
  .gmail-account-item:hover {
    background: rgba(255, 210, 125, 0.18);
    border-color: #ffd27d;
  }
  .gmail-account-email { font-weight: 700; font-size: 14px; color: #ffd27d; }
  .gmail-account-sub { font-size: 12px; color: #d8c39e; }

  .gmail-custom-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .gmail-custom-input {
    flex: 1;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #c89d54;
    background: #18100b;
    color: #fff3d6;
    font-size: 14px;
    outline: none;
  }

  .modal-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .modal-btn {
    background: linear-gradient(180deg, #2d8bc9, #1b5c8a);
    color: white;
    border: 1px solid #7cc7f7;
    padding: 8px 20px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  .modal-btn-secondary {
    background: rgba(255,255,255,0.12);
    border: 1px solid #9e845c;
  }
</style>
</head>
<body>

<div class="game-screen">
  <div class="account-status" id="accountStatus">ยังไม่ได้ล็อกอิน Gmail</div>

  <!-- พื้นที่กดทับปุ่มจริงในภาพ -->
  <button type="button" class="hotspot-gmail" onclick="openGmailLogin()" title="Sign in with Gmail"></button>
  <button type="button" class="hotspot-start" onclick="handleStart()" title="START GAME"></button>
  <button type="button" class="hotspot-server" onclick="showPopup('เลือกเซิร์ฟเวอร์', 'เซิร์ฟเวอร์ปัจจุบัน: Arcadia (Asia) - สถานะ: ออนไลน์ปกติ')" title="Server Select"></button>

  <div class="modal-overlay" id="modal">
    <div class="modal-box" id="modalBox">
      <h2 id="modalTitle">แจ้งเตือน</h2>
      <p id="modalText">รายละเอียด</p>
      <div id="modalExtra"></div>
      <div class="modal-actions" id="modalActions">
        <button class="modal-btn" onclick="closePopup()">ตกลง</button>
      </div>
    </div>
  </div>
</div>

<script>
  window.onload = () => {
    const savedGmail = localStorage.getItem('hunteria_gmail');
    updateAccountStatus(savedGmail);
  };

  function updateAccountStatus(email) {
    const el = document.getElementById('accountStatus');
    if (email) {
      el.innerText = 'Gmail: ' + email;
    } else {
      el.innerText = 'ยังไม่ได้ล็อกอิน Gmail';
    }
  }

  function handleStart() {
    const email = localStorage.getItem('hunteria_gmail');
    if (!email) {
      showPopup(
        'กรุณาล็อกอินก่อนเริ่มเกม',
        'โปรดกดที่ปุ่ม Sign in with Google / Login with Gmail เพื่อเลือกบัญชี Gmail ของคุณก่อนครับ',
        '',
        `
          <button type="button" class="modal-btn" onclick="openGmailLogin()">ล็อกอิน Gmail</button>
          <button type="button" class="modal-btn modal-btn-secondary" onclick="closePopup()">ปิด</button>
        `
      );
      return;
    }

    showPopup(
      'เข้าสู่โลกอาร์คาเดีย',
      'บัญชี: ' + email + '\nเซิร์ฟเวอร์: Arcadia (Asia)\nพร้อมเข้าสู่หน้าเลือกตัวละคร!'
    );
  }

  function openGmailLogin() {
    const lastGmail = localStorage.getItem('hunteria_gmail') || '';
    const extraHtml = `
      <div class="gmail-list">
        ${lastGmail ? `
          <div class="gmail-account-item" onclick="completeGmailLogin('${escapeAttr(lastGmail)}')">
            <span class="gmail-account-email">${escapeHtml(lastGmail)}</span>
            <span class="gmail-account-sub">บัญชี Gmail ที่ใช้ล่าสุด</span>
          </div>
        ` : ''}
        <div class="gmail-account-item" onclick="completeGmailLogin('hunter.arcadia@gmail.com')">
          <span class="gmail-account-email">hunter.arcadia@gmail.com</span>
          <span class="gmail-account-sub">บัญชีนักล่าอาร์คาเดีย</span>
        </div>
      </div>
      <div class="gmail-custom-row">
        <input type="email" id="customGmailInput" class="gmail-custom-input" placeholder="กรอก @gmail.com ของคุณ...">
        <button type="button" class="modal-btn" onclick="submitCustomGmail()">ใช้เมลนี้</button>
      </div>
    `;

    showPopup(
      'ล็อกอินผ่าน Gmail',
      'เลือกบัญชี Gmail หรือกรอกอีเมลของคุณเพื่อเข้าสู่เกม HUNTERIA',
      extraHtml,
      `<button type="button" class="modal-btn modal-btn-secondary" onclick="closePopup()">ยกเลิก</button>`
    );
  }

  function submitCustomGmail() {
    const input = document.getElementById('customGmailInput');
    if (!input) return;
    const email = input.value.trim();
    if (!email || !email.includes('@')) {
      alert('กรุณากรอกที่อยู่ Gmail ให้ถูกต้องครับ');
      return;
    }
    completeGmailLogin(email);
  }

  function completeGmailLogin(email) {
    localStorage.setItem('hunteria_gmail', email);
    updateAccountStatus(email);
    showPopup(
      'ล็อกอิน Gmail สำเร็จ',
      'เชื่อมต่อบัญชี ' + email + ' เรียบร้อยแล้ว กด START GAME เพื่อเข้าสู่เกมได้เลยครับ'
    );
  }

  function showPopup(title, text, extraHtml = '', actionsHtml = `<button class="modal-btn" onclick="closePopup()">ตกลง</button>`) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalText').innerText = text;
    document.getElementById('modalExtra').innerHTML = extraHtml;
    document.getElementById('modalActions').innerHTML = actionsHtml;
    document.getElementById('modal').style.display = 'flex';
  }

  function closePopup() {
    document.getElementById('modal').style.display = 'none';
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
  }

  function escapeAttr(str) {
    return String(str).replace(/'/g, "\\'");
  }
</script>
</body>
</html>
